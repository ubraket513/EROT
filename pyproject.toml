[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "EROT"
version = "0.1.0"
description = "Accelerator-oriented entropy-regularized optimal transport"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
  {name = "Dohyoung Ko", email = "dzk5572@gmail.com"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "jax>=0.4.30",
  "numpy>=1.26",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.4.30"]
cuda13 = ["jax[cuda13]>=0.5.0"]
plot = ["matplotlib>=3.8"]
test = [
  "cvxpy>=1.4",
  "pytest>=8",
  "scipy>=1.11",
]
dev = [
  "build>=1.2",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[project.scripts]
erot = "erot.cli:main"

[project.urls]
Homepage = "https://github.com/kodh49/EROT"
Issues = "https://github.com/kodh49/EROT/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["erot*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "reference: compares against an optional independent numerical solver",
  "gpu: requires a CUDA-enabled JAX installation",
  "packaging: inspects artifacts selected by EROT_DIST_DIR",
  "distributed: requires an explicitly configured distributed runtime",
]
