target-version = "py311"
line-length = 88
indent-width = 4
src = ["src"]
extend-exclude = [
    "archive",
    "numerical-gradient-flows",
    "QOTLib",
    "SDP-Simulation",
    ".serena",
    ".superpowers",
    ".worktrees",
]

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[format]
quote-style = "double"
indent-style = "space"
