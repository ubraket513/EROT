target-version = "py311"
line-length = 88
indent-width = 4
src = ["src"]
extend-exclude = [
    ".serena",
    ".superpowers",
    ".worktrees",
]

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
known-first-party = ["erot", "benchmarks"]

[format]
quote-style = "double"
indent-style = "space"
